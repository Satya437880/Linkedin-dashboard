<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Maple MPSS Capture options</title>
<style>
  body{font:14px system-ui,sans-serif;color:#333;max-width:520px;margin:32px auto;padding:0 16px}
  label{display:block;margin-top:14px;font-weight:600}
  input{width:100%;padding:8px;margin-top:4px;box-sizing:border-box;border:1px solid #888;border-radius:4px}
  input:focus,button:focus{outline:2px solid #F58220;outline-offset:2px}
  button{margin-top:16px;padding:8px 14px;background:#222;color:#fff;border:0;border-radius:4px}
  #status{margin-top:16px;color:#666}
</style></head>
<body>
  <h1>Maple MPSS Capture options</h1>
  <label for="appUrl">App URL</label><input id="appUrl" placeholder="http://localhost:3000">
  <label for="token">Ingest token</label><input id="token" type="password" autocomplete="off">
  <label for="ownName">Your name on LinkedIn</label><input id="ownName" autocomplete="name" placeholder="For example: Alex Morgan Lee">
  <p style="margin:6px 0 0;color:#666;font-size:12px">Used to tell your messages from the client's. Leave it blank to detect it automatically.</p>
  <button id="save" type="button">Save</button>
  <p id="status" role="status"></p>
  <p id="last"></p>
  <script src="options.js"></script>
</body></html>
